User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
LogLevel Warning
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 100
Allow 127.0.0.1
DisableViaHeader Yes

Filter "/etc/openhands/egress-filter"
FilterType fqdn
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

ConnectPort 443
