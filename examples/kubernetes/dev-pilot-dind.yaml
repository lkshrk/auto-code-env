apiVersion: v1
kind: Pod
metadata:
  name: dev-pilot-dind
spec:
  containers:
      - name: dev-pilot
        image: ghcr.io/lkshrk/auto-code-env:dev-pilot-latest
      command: ["sleep", "infinity"]
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
    - name: docker
      image: docker:29.7.2-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      args: ["--host=tcp://127.0.0.1:2375"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: docker-data
          mountPath: /var/lib/docker
      readinessProbe:
        exec:
          command: ["docker", "--host=tcp://localhost:2375", "info"]
        initialDelaySeconds: 2
        periodSeconds: 2
  volumes:
    - name: docker-data
      emptyDir: {}
