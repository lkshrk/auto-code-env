---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenHands automations validate

on:
  pull_request:
    paths:
      - .github/workflows/openhands-automations-validate.yaml
      - openhands/automations/**

permissions:
  contents: read

jobs:
  specs:
    name: deterministic checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate automation specs
        shell: bash
        run: |
          set -euo pipefail
          bash openhands/automations/tests/spec.Tests.sh
          python3 -m unittest discover -s openhands/automations/tests -p 'test_*.py' -v
          shellcheck openhands/automations/tests/spec.Tests.sh
