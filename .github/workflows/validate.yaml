name: validate

on:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lkshrk/auto-code-env

jobs:
  validate:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Check Dockerfile, Bake, and shell syntax
        run: |
          docker build --check .
          docker buildx bake --print dev-full dev-pilot dev-hermes dev-both
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          test/init.sh
          test/health.sh
          test/sshd.sh
          test/workspace-state.sh

      - name: Build and smoke all variants
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for target in dev-full dev-pilot dev-hermes dev-both; do
            image="auto-code-env-ci:${target}-${ARCH}"
            docker buildx bake --load \
              --set "${target}.platform=${PLATFORM}" \
              --set "${target}.tags=${image}" \
              --set "${target}.secrets=id=GITHUB_TOKEN,env=GITHUB_TOKEN" \
              --set "${target}.cache-from=type=gha,scope=full-${ARCH}" \
              --set "${target}.cache-to=type=gha,mode=max,scope=full-${ARCH}" \
              "$target"
            nested=0
            [ "$target" != dev-both ] || nested=1
            PLATFORM="$PLATFORM" NESTED_DOCKER="$nested" test/smoke.sh "$target" "$image"
            old_image="${IMAGE}:${target}-latest"
            docker pull --platform "$PLATFORM" "$old_image"
            if ! docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "$old_image" -c \
              'test "$(id -u dev)" = 1000 && command -v auto-code-init auto-code-health auto-code-sshd >/dev/null'; then
              echo "${old_image} lacks the workspace lifecycle contract; using the candidate for bootstrap coverage"
              old_image="$image"
            fi
            test/workspace.sh "$target" "$old_image" "$image"
          done

  devbox-lint:
    name: Devbox lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Shellcheck and bake syntax
        run: |
          shellcheck image/scripts/*.sh image/scripts/devbox-init scripts/devbox tests/smoke/run.sh
          docker buildx bake --print devbox

      - name: Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
          bats tests/devbox-init.bats tests/devbox.bats

  devbox-image:
    name: Devbox ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [go, python, ts, lua, full, hermes, pilot]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v6
        with:
          targets: devbox-${{ matrix.variant }}
          load: true
          set: |
            *.cache-from=type=gha,scope=devbox-${{ matrix.variant }}
            *.cache-to=type=gha,scope=devbox-${{ matrix.variant }},mode=max
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke
        run: docker run --rm -v "$PWD/tests/smoke:/smoke:ro" "ghcr.io/lkshrk/devbox/${{ matrix.variant }}:dev" /smoke/run.sh "${{ matrix.variant }}"
