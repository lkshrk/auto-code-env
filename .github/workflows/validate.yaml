---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  containerfile:
    name: Containerfile syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: docker build --check
        run: docker build --check -f image/Containerfile image

  coder-templates:
    name: Coder templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Terraform
        run: |
          set -euo pipefail
          TERRAFORM_VERSION="1.15.5"
          TERRAFORM_ASSET="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${TERRAFORM_ASSET}" -o /tmp/terraform.zip
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o /tmp/terraform.SHA256SUMS
          TERRAFORM_SHA256=$(awk -v f="$TERRAFORM_ASSET" '$2 == f { print $1; exit }' /tmp/terraform.SHA256SUMS)
          echo "$TERRAFORM_SHA256  /tmp/terraform.zip" | sha256sum -c -
          unzip -q /tmp/terraform.zip -d /tmp/terraform
          sudo install /tmp/terraform/terraform /usr/local/bin/terraform

      - name: Validate every template
        run: |
          set -euo pipefail
          TEMPLATE_DIR="coder/templates"
          for dir in "$TEMPLATE_DIR"/*/; do
            name=$(basename "$dir")
            echo "Validating template: $name"
            tmpdir=$(mktemp -d)
            cp "$TEMPLATE_DIR/common.tf" "$tmpdir/common.tf"
            cp "$dir"*.tf "$tmpdir/"
            terraform -chdir="$tmpdir" fmt -check -diff
            terraform -chdir="$tmpdir" init -backend=false -input=false
            terraform -chdir="$tmpdir" validate
            rm -rf "$tmpdir"
          done

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: yamllint
        run: |
          set -euo pipefail
          pipx install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}" \
            .github/workflows

  verify-script:
    name: verify.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run verify script
        run: bash scripts/verify.sh
