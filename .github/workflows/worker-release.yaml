---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Worker release

on:
  push:
    tags:
      - openhands-worker-v*

permissions:
  contents: read

concurrency:
  group: release-openhands-worker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag and assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          [[ "$tag" == openhands-worker-v* ]]
          VERSION=${tag#openhands-worker-v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_commit=$(git ls-remote --tags origin "refs/tags/$tag" | awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
            $2 == direct { direct_oid = $1 }
            $2 == peeled { peeled_oid = $1 }
            END { print peeled_oid != "" ? peeled_oid : direct_oid }
          ')
          test -n "$tag_commit"
          test "$tag_commit" = "$GITHUB_SHA"
          mkdir -p release
          cp openhands/profiles/apply-profile.py release/apply-profile.py
          profiles=()
          for source in openhands/profiles/*.json; do
            test -f "$source"
            asset="profile-$(basename "$source")"
            cp "$source" "release/$asset"
            profiles+=("$asset")
          done
          test "${#profiles[@]}" -gt 0
          (cd release && sha256sum apply-profile.py "${profiles[@]}" > checksums.txt)
          (cd release && sha256sum -c checksums.txt)
          release_json="$RUNNER_TEMP/release.json"
          release_error="$RUNNER_TEMP/release-error.log"
          if ! gh release view "$tag" --json isDraft,tagName,assets > "$release_json" 2> "$release_error"; then
            if ! grep -Eqi 'HTTP 404|not found' "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "OpenHands worker $VERSION" \
              --generate-notes
            gh release view "$tag" --json isDraft,tagName,assets > "$release_json"
          fi
          test "$(jq -r '.tagName' "$release_json")" = "$tag"
          release_draft=$(jq -r '.isDraft' "$release_json")
          case "$release_draft" in
            true)
              gh release upload "$tag" --clobber \
                release/apply-profile.py \
                "${profiles[@]/#/release/}" \
                release/checksums.txt
              ;;
            false)
              for asset in apply-profile.py "${profiles[@]}" checksums.txt; do
                digest="sha256:$(sha256sum "release/$asset" | awk '{print $1}')"
                jq -e --arg asset "$asset" --arg digest "$digest" \
                  '.assets[] | select(.name == $asset and .state == "uploaded" and .digest == $digest)' \
                  "$release_json" >/dev/null
              done
              ;;
            *)
              echo "::error::Unexpected release draft state: $release_draft"
              exit 1
              ;;
          esac
          {
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_IS_DRAFT=$release_draft"
          } >> "$GITHUB_ENV"

      - name: Publish verified draft release
        shell: bash
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          if test "$RELEASE_IS_DRAFT" = true; then
            gh release edit "$tag" --draft=false
          elif test "$RELEASE_IS_DRAFT" != false; then
            echo "::error::Unexpected release draft state: $RELEASE_IS_DRAFT"
            exit 1
          fi
