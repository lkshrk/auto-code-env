---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Worker validate

on:
  pull_request:
    paths:
      - .github/workflows/worker-validate.yaml
      - .github/workflows/worker-release.yaml
      - openhands/profiles/**
      - tools/check-root-calculation.sh

permissions:
  contents: read

jobs:
  checks:
    name: deterministic checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          bash openhands/profiles/tests/applier.Tests.sh
          bash openhands/profiles/tests/profile-json.Tests.sh
          bash tools/check-root-calculation.sh
          shellcheck openhands/profiles/tests/applier.Tests.sh openhands/profiles/tests/profile-json.Tests.sh

  settings-contracts:
    name: settings contracts ${{ matrix.openhands }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        openhands: ["1.44.0", "1.46.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create isolated supported-version environment
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/settings-contracts"
          "$RUNNER_TEMP/settings-contracts/bin/python" -m pip install \
            "openhands-agent-server==${{ matrix.openhands }}" \
            "openhands-sdk==${{ matrix.openhands }}" \
            "agent-client-protocol==0.10.1" "posthog>=6,<7"
          "$RUNNER_TEMP/settings-contracts/bin/python" -m pip check

      - name: Require installed model and snapshot contracts
        shell: bash
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
          EXPECTED_OPENHANDS_VERSION: ${{ matrix.openhands }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/settings-contracts/bin/python" openhands/profiles/tests/settings-contracts.py
