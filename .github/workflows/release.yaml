---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Calendar-versioned release: tag main, build + push the image, then
# trigger h-cloud's deploy pipeline. One workflow, not three, because a
# tag created with the default GITHUB_TOKEN cannot trigger other
# workflows via push:tags (GitHub's anti-recursion safeguard) - chaining
# the jobs directly here avoids needing a second credential (a GitHub
# App/PAT) just to make that cross-workflow trigger fire.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/lkshrk/hermes-hq

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-next-tag.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get previous tag and determine next tag
        id: determine-next-tag
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |-
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });

            const prevTag = tags[0]?.name || "0.0.0";
            const [prevMajor, prevMinor, prevPatch] = prevTag.split('.').map(Number);
            const now = new Date();
            const nextMajorMinor = `${now.getFullYear()}.${now.getMonth() + 1}`;
            const nextPatch = `${prevMajor}.${prevMinor}` === nextMajorMinor ? prevPatch + 1 : 0;

            console.log(`Previous tag: ${prevTag}`);
            console.log(`Next tag: ${nextMajorMinor}.${nextPatch}`);

            return `${nextMajorMinor}.${nextPatch}`;

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |-
            const tagName = "${{ steps.determine-next-tag.outputs.result }}";

            const tag = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
              message: tagName,
              object: context.sha,
              type: "commit"
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: tag.data.sha
            });

  build-and-push:
    name: Build & push image
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dotfiles commit (cache-busting build arg)
        id: dotfiles-commit
        env:
          # TEMPORARY: dotfiles main still has the broken docker apt-repo
          # config (fix sits unmerged on fix/omni-containers-group,
          # pending review) - building against main fails apt-get for
          # every package in the same omni tools sync run. Pinned to the
          # combined verification branch release-ready (containers-group
          # fix + rbw provider + hermes@hermes dots package, all already
          # tested individually) until the real PRs are reviewed and
          # merged. Revert DOTFILES_REF to main once that happens.
          DOTFILES_REF: release-ready
        run: |
          set -euo pipefail
          COMMIT=$(git ls-remote https://github.com/lkshrk/dotfiles.git "refs/heads/${DOTFILES_REF}" | cut -f1)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "ref=$DOTFILES_REF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: image
          file: image/Containerfile
          push: true
          build-args: |
            DOTFILES_COMMIT=${{ steps.dotfiles-commit.outputs.commit }}
            DOTFILES_REF=${{ steps.dotfiles-commit.outputs.ref }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64

  trigger-deploy:
    name: Trigger h-cloud deploy
    needs: [tag, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Fire image-update dispatch
        env:
          GH_TOKEN: ${{ secrets.H_CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::H_CLOUD_DISPATCH_TOKEN secret is not set - skipping the h-cloud deploy trigger."
            echo "::warning::Image ghcr.io/lkshrk/hermes-hq:${TAG} was still built and pushed; h-cloud"
            echo "::warning::deploy will need a manual repository_dispatch (or wait for"
            echo "::warning::H_CLOUD_DISPATCH_TOKEN to be added: a PAT/GitHub App token with"
            echo "::warning::contents:write on lkshrk/h-cloud, stored as this repo's secret)."
            exit 0
          fi
          curl -fsSL --proto-redir '=https' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lkshrk/h-cloud/dispatches \
            -d "{\"event_type\":\"image-update\",\"client_payload\":{\"app\":\"hermes-hq\",\"image\":\"ghcr.io/lkshrk/hermes-hq\",\"tag\":\"${TAG}\"}}"
          echo "Dispatched image-update to lkshrk/h-cloud: hermes-hq -> ${TAG}"
