---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Calendar-versioned release tag, same scheme as lkshrk/h-cloud's own
# tag.yaml (YYYY.M.PATCH, monthly major/minor bump, patch resets).
# Tagging main triggers build-image.yaml via the push-tags event.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get previous tag and determine next tag
        id: determine-next-tag
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |-
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });

            const prevTag = tags[0]?.name || "0.0.0";
            const [prevMajor, prevMinor, prevPatch] = prevTag.split('.').map(Number);
            const now = new Date();
            const nextMajorMinor = `${now.getFullYear()}.${now.getMonth() + 1}`;
            const nextPatch = `${prevMajor}.${prevMinor}` === nextMajorMinor ? prevPatch + 1 : 0;

            console.log(`Previous tag: ${prevTag}`);
            console.log(`Next tag: ${nextMajorMinor}.${nextPatch}`);

            return `${nextMajorMinor}.${nextPatch}`;

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |-
            const tagName = "${{ steps.determine-next-tag.outputs.result }}";

            const tag = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
              message: tagName,
              object: context.sha,
              type: "commit"
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: tag.data.sha
            });
