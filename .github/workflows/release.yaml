name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lkshrk/auto-code-env

jobs:
  candidate:
    name: Candidate ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke all candidates
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for target in dev-full dev-pilot dev-hermes dev-both; do
            image="${IMAGE}:${target}-candidate-${RUN_ID}-${ARCH}"
            docker buildx bake --push \
              --set "${target}.platform=${PLATFORM}" \
              --set "${target}.tags=${image}" \
              --set "${target}.secrets=id=GITHUB_TOKEN,env=GITHUB_TOKEN" \
              --set "${target}.cache-from=type=gha,scope=full-${ARCH}" \
              --set "${target}.cache-to=type=gha,mode=max,scope=full-${ARCH}" \
              "$target"
            docker pull --platform "$PLATFORM" "$image"
            nested=0
            [ "$target" != dev-both ] || nested=1
            PLATFORM="$PLATFORM" NESTED_DOCKER="$nested" test/smoke.sh "$target" "$image"
          done

  promote:
    name: Promote ${{ matrix.target }}
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev-full, dev-pilot, dev-hermes, dev-both]
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            tags=(--tag "${IMAGE}:${TARGET}-${REF_NAME}")
          else
            tags=(--tag "${IMAGE}:${TARGET}-sha-${SHA::12}" --tag "${IMAGE}:${TARGET}-latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${TARGET}-candidate-${RUN_ID}-amd64" \
            "${IMAGE}:${TARGET}-candidate-${RUN_ID}-arm64"
