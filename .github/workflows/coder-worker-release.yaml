---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Coder worker release

on:
  push:
    tags:
      - coder-worker-v*

permissions:
  contents: read

concurrency:
  group: release-coder-worker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the release contents
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          [[ "$tag" == coder-worker-v* ]]
          VERSION=${tag#coder-worker-v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_commit=$(git ls-remote --tags origin "refs/tags/$tag" | awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
            $2 == direct { direct_oid = $1 }
            $2 == peeled { peeled_oid = $1 }
            END { print peeled_oid != "" ? peeled_oid : direct_oid }
          ')
          test -n "$tag_commit"
          test "$tag_commit" = "$GITHUB_SHA"
          grep -Fxq "\$DefaultRelease = \"$tag\"" coder-worker/windows/install.ps1
          grep -Fxq "readonly RELEASE_VERSION=$VERSION" coder-worker/wsl/coder-worker-overlay
          bash coder-worker/tests/release.Tests.sh
          bash coder-worker/tests/profile.Tests.sh
          bash coder-worker/tests/install.Tests.sh
          bash coder-worker/tests/overlay.Tests.sh
          bash coder-worker/tests/gen-docker-tls.Tests.sh
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            mcr.microsoft.com/powershell@sha256:c2bee73acbaa53e9209daab8075b5d234f0f04e6824e7b6f7bf7dde1ba5b772b \
            pwsh -NoProfile -File coder-worker/tests/install.Tests.ps1
          find coder-worker -type f -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck coder-worker/wsl/coder-worker-overlay
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Assemble assets and gate on the embedded checksums digest
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          digest=$(bash coder-worker/scripts/release-checksums.sh --out "$release")
          if ! grep -Fxq "\$DefaultChecksumsSha256 = \"$digest\"" coder-worker/windows/install.ps1; then
            echo "::error::install.ps1 must embed \$DefaultChecksumsSha256 = \"$digest\""
            exit 1
          fi
          (cd "$release" && ls -1) > "$RUNNER_TEMP/assets.txt"

      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          release="$RUNNER_TEMP/release"
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          release_json="$RUNNER_TEMP/release.json"
          release_error="$RUNNER_TEMP/release-error.log"
          if ! gh release view "$tag" --json isDraft,tagName,assets > "$release_json" 2> "$release_error"; then
            if ! grep -Eqi 'HTTP 404|not found' "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "Coder worker $VERSION" \
              --generate-notes
            gh release view "$tag" --json isDraft,tagName,assets > "$release_json"
          fi
          test "$(jq -r '.tagName' "$release_json")" = "$tag"
          release_draft=$(jq -r '.isDraft' "$release_json")
          case "$release_draft" in
            true)
              gh release upload "$tag" --clobber "${assets[@]/#/$release/}"
              gh release edit "$tag" --draft=false
              ;;
            false)
              for asset in "${assets[@]}"; do
                digest="sha256:$(sha256sum "$release/$asset" | awk '{print $1}')"
                jq -e --arg asset "$asset" --arg digest "$digest" \
                  '.assets[] | select(.name == $asset and .state == "uploaded" and .digest == $digest)' \
                  "$release_json" >/dev/null
              done
              ;;
            *)
              echo "::error::Unexpected release draft state: $release_draft"
              exit 1
              ;;
          esac
