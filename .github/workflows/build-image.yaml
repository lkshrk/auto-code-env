---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds and pushes the hermes-hq control-hub image on every release tag,
# then triggers h-cloud's deploy pipeline via repository_dispatch - the
# same mechanism other apps (e.g. quintessenz, per update-image.yml's own
# docstring) already use to go from "new image built" to "manifest
# updated and Flux reconciling" with no manual step.
name: build-image

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and push (defaults to the triggering git tag)
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lkshrk/hermes-hq

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve tag
        id: resolve-tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dotfiles commit (cache-busting build arg)
        id: dotfiles-commit
        run: |
          set -euo pipefail
          COMMIT=$(git ls-remote https://github.com/lkshrk/dotfiles.git refs/heads/main | cut -f1)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: image
          file: image/Containerfile
          push: true
          build-args: |
            DOTFILES_COMMIT=${{ steps.dotfiles-commit.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.resolve-tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64

  trigger-deploy:
    name: Trigger h-cloud deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Fire image-update dispatch
        env:
          GH_TOKEN: ${{ secrets.H_CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::H_CLOUD_DISPATCH_TOKEN secret is not set - skipping the h-cloud deploy trigger."
            echo "::warning::Image ghcr.io/lkshrk/hermes-hq:${TAG} was still built and pushed; h-cloud"
            echo "::warning::deploy will need a manual repository_dispatch (or wait for"
            echo "::warning::H_CLOUD_DISPATCH_TOKEN to be added: a PAT/GitHub App token with"
            echo "::warning::contents:write on lkshrk/h-cloud, stored as this repo's secret)."
            exit 0
          fi
          curl -fsSL --proto-redir '=https' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lkshrk/h-cloud/dispatches \
            -d "{\"event_type\":\"image-update\",\"client_payload\":{\"app\":\"hermes-hq\",\"image\":\"ghcr.io/lkshrk/hermes-hq\",\"tag\":\"${TAG}\"}}"
          echo "Dispatched image-update to lkshrk/h-cloud: hermes-hq -> ${TAG}"
