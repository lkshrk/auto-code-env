---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenCode control-plane image

on:
  push:
    branches:
      - main
    paths:
      - opencode/image/**
      - opencode/plugins/**
      - .github/workflows/opencode-image.yaml
  pull_request:
    paths:
      - opencode/image/**
      - opencode/plugins/**
      - .github/workflows/opencode-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OpenCode version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's|^FROM ghcr.io/anomalyco/opencode:\([0-9.]*\)@.*|\1|p' opencode/image/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: opencode
          file: opencode/image/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lkshrk/opencode-control-plane:${{ steps.version.outputs.version }}
            ghcr.io/lkshrk/opencode-control-plane:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
