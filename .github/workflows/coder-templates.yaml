---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Coder Templates

on:
  push:
    branches:
      - main
    paths:
      - coder/templates/**
      - coder/modules/**
      - coder/scripts/**
      - .github/workflows/coder-templates.yaml
  pull_request:
    paths:
      - coder/templates/**
      - coder/modules/**
      - coder/scripts/**
      - .github/workflows/coder-templates.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'publication-main' || format('validation-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  push-templates:
    name: Push Templates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Test packaging and selection
        run: |
          set -euo pipefail
          bash coder/templates/tests/packaging.sh
          bash coder/templates/tests/selection.sh
          bash coder/templates/tests/prepare-dotfiles.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s coder/templates/tests -p 'test_*.py'

      - name: Select templates
        id: selected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" changed "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/coder-template-dirs"
          else
            bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" all > "$RUNNER_TEMP/coder-template-dirs"
          fi
          if [[ -s "$RUNNER_TEMP/coder-template-dirs" ]]; then
            echo 'has_templates=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Package templates once
        if: steps.selected.outputs.has_templates == 'true'
        id: packaged
        run: |
          set -euo pipefail
          packages=$(mktemp -d "$RUNNER_TEMP/coder-packages.XXXXXX")
          echo "root=$packages" >> "$GITHUB_OUTPUT"
          while IFS= read -r dir; do
            bash coder/scripts/package-template.sh "$dir" "$packages/${dir##*/}"
          done < "$RUNNER_TEMP/coder-template-dirs"

      - name: Validate packaged templates
        if: steps.selected.outputs.has_templates == 'true'
        env:
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r dir; do
            packages+=("$PACKAGES/${dir##*/}")
          done < "$RUNNER_TEMP/coder-template-dirs"
          bash coder/scripts/validate-templates.sh "${packages[@]}"

      - name: Install Coder CLI
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.selected.outputs.has_templates == 'true'
        env:
          CODER_URL: https://coder.h-cloud.io
        run: |
          set -euo pipefail
          version=$(curl -fsSL "$CODER_URL/api/v2/buildinfo" | jq -er '.version' | sed 's/^v//; s/+.*//')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          curl -fsSL "https://github.com/coder/coder/releases/download/v${version}/coder_${version}_linux_amd64.deb" -o "$RUNNER_TEMP/coder.deb"
          sudo dpkg -i "$RUNNER_TEMP/coder.deb"
          rm "$RUNNER_TEMP/coder.deb"

      - name: Push validated packages to Coder
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.selected.outputs.has_templates == 'true'
        env:
          CODER_URL: https://coder.h-cloud.io
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            name=${dir##*/}
            coder templates push "$name" --directory "$PACKAGES/$name" --yes
          done < "$RUNNER_TEMP/coder-template-dirs"

      - name: Clean packages
        if: always() && steps.packaged.outputs.root != ''
        env:
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: rm -rf -- "$PACKAGES"
