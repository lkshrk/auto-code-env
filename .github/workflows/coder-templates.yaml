---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Coder Templates

on:
  push:
    branches: [main]
    paths: [coder/devbox/**]
  pull_request:
    paths: [coder/devbox/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - name: Validate devbox template
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          cp coder/devbox/*.tf "$tmpdir/"
          terraform -chdir="$tmpdir" fmt -check -diff
          terraform -chdir="$tmpdir" init -backend=false -input=false
          terraform -chdir="$tmpdir" validate

      # Task 10 enables template push after image_version is immutable.
