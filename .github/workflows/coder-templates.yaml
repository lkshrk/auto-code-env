---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Coder Templates

on:
  push:
    branches:
      - main
    paths:
      - coder/templates/**
      - coder/modules/**
      - coder/scripts/**
      - coder/targets.json
      - .github/workflows/coder-templates.yaml
  pull_request:
    paths:
      - coder/templates/**
      - coder/modules/**
      - coder/scripts/**
      - coder/targets.json
      - .github/workflows/coder-templates.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verifying dotfiles and preserved-checkout readiness
        required: false
        default: false
        type: boolean
      dotfiles_revision:
        description: Full tested dotfiles commit SHA (required for publication)
        required: false
        default: ""
        type: string
      legacy_templates:
        description: Additional legacy template names, comma-separated (no backend overrides)
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'publication-main' || format('validation-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  push-templates:
    name: Push Templates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Test packaging and selection
        run: |
          set -euo pipefail
          bash coder/templates/tests/packaging.sh
          bash coder/templates/tests/selection.sh
          bash coder/templates/tests/prepare-dotfiles.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s coder/templates/tests -p 'test_*.py'

      - name: Select templates
        id: selected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          LEGACY_TEMPLATES: ${{ inputs.legacy_templates }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" targets-changed "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/coder-template-targets"
            changed=$(bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" changed "$BASE_SHA" "$HEAD_SHA")
            while IFS= read -r dir; do
              [[ -z "$dir" || "$dir" == coder/templates/dev ]] && continue
              bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" legacy "${dir##*/}" >> "$RUNNER_TEMP/coder-template-targets"
            done <<< "$changed"
          else
            bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" targets > "$RUNNER_TEMP/coder-template-targets"
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$LEGACY_TEMPLATES" ]]; then
            bash coder/scripts/select-templates.sh "$GITHUB_WORKSPACE" legacy "$LEGACY_TEMPLATES" >> "$RUNNER_TEMP/coder-template-targets"
          fi
          if [[ -s "$RUNNER_TEMP/coder-template-targets" ]]; then
            echo 'has_templates=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Package templates once
        if: steps.selected.outputs.has_templates == 'true'
        id: packaged
        run: |
          set -euo pipefail
          packages=$(mktemp -d "$RUNNER_TEMP/coder-packages.XXXXXX")
          echo "root=$packages" >> "$GITHUB_OUTPUT"
          while IFS=$'\t' read -r name dir backend; do
            options=()
            if [[ "$backend" != - ]]; then
              options=(--backend "$backend")
            fi
            bash coder/scripts/package-template.sh "$dir" "$packages/$name" "${options[@]}"
          done < "$RUNNER_TEMP/coder-template-targets"

      - name: Validate packaged templates
        if: steps.selected.outputs.has_templates == 'true'
        env:
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: |
          set -euo pipefail
          packages=()
          while IFS=$'\t' read -r name dir backend; do
            packages+=("$PACKAGES/$name")
          done < "$RUNNER_TEMP/coder-template-targets"
          bash coder/scripts/validate-templates.sh "${packages[@]}"

      - name: Test exact dotfiles revision pair
        env:
          DOTFILES_REVISION: ${{ inputs.dotfiles_revision || (github.event_name == 'pull_request' && 'd7b4333abf4c9193e93c85baa91ceab3b12feaf4' || '') }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && ! "$DOTFILES_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Publication requires the full tested dotfiles commit SHA' >&2
            exit 1
          fi
          dotfiles=$(mktemp -d "$RUNNER_TEMP/coder-dotfiles.XXXXXX")
          trap 'rm -rf "$dotfiles"' EXIT
          git clone https://github.com/lkshrk/dotfiles.git "$dotfiles"
          if [[ -n "$DOTFILES_REVISION" ]]; then
            [[ "$DOTFILES_REVISION" =~ ^[0-9a-f]{40}$ ]]
            git -C "$dotfiles" checkout --detach "$DOTFILES_REVISION"
          fi
          echo "auto-code-env=$(git rev-parse HEAD) dotfiles=$(git -C "$dotfiles" rev-parse HEAD)"
          python3 coder/templates/shared/dotfiles-contract.py "$dotfiles"
          CODER_TEST_DOTFILES="$dotfiles" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s coder/templates/tests -p test_dotfiles_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 "$dotfiles/tests/coder-components.py"
          if [[ "$PUBLISH" == true && "$(git -C "$dotfiles" rev-parse origin/HEAD)" != "$DOTFILES_REVISION" ]]; then
            echo 'The tested revision must be the default branch cloned by new workspaces' >&2
            exit 1
          fi

      - name: Install Coder CLI
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish && steps.selected.outputs.has_templates == 'true'
        env:
          CODER_URL: https://coder.h-cloud.io
        run: |
          set -euo pipefail
          version=$(curl -fsSL "$CODER_URL/api/v2/buildinfo" | jq -er '.version' | sed 's/^v//; s/+.*//')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          curl -fsSL "https://github.com/coder/coder/releases/download/v${version}/coder_${version}_linux_amd64.deb" -o "$RUNNER_TEMP/coder.deb"
          sudo dpkg -i "$RUNNER_TEMP/coder.deb"
          rm "$RUNNER_TEMP/coder.deb"

      - name: Push validated packages to Coder
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish && steps.selected.outputs.has_templates == 'true'
        env:
          CODER_URL: https://coder.h-cloud.io
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name dir backend; do
            coder templates push "$name" --directory "$PACKAGES/$name" --yes
          done < "$RUNNER_TEMP/coder-template-targets"

      - name: Clean packages
        if: always() && steps.packaged.outputs.root != ''
        env:
          PACKAGES: ${{ steps.packaged.outputs.root }}
        run: rm -rf -- "$PACKAGES"
