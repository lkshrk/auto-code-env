---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenHands chart release

on:
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - openhands/chart/upstream
permissions:
  contents: write
  packages: write

concurrency:
  group: release-openhands-chart
  cancel-in-progress: false

env:
  OCI_REPOSITORY: oci://ghcr.io/lkshrk/charts/openhands-agent-canvas

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4

      - name: Prepare package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          upstream=openhands/chart/upstream
          git -C "$upstream" fetch --force --tags origin
          chart="$upstream/helm/agent-canvas"
          tag=$(git -C "$upstream" describe --tags --exact-match)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          commit=$(git -C "$upstream" rev-parse HEAD)
          epoch=$(git -C "$upstream" show -s --format=%ct HEAD)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' "$chart/Chart.yaml")
          test "$tag" = "v$app_version"
          test -z "$(git -C "$upstream" status --porcelain)"

          build=$(mktemp -d)
          cp -a "$chart" "$build/openhands-agent-canvas"
          python3 - "$build/openhands-agent-canvas/Chart.yaml" "$version" "$tag" "$commit" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version, tag, commit = sys.argv[2:]
          chart = path.read_text()
          chart, names = re.subn(r"^name:.*$", "name: openhands-agent-canvas", chart, count=1, flags=re.MULTILINE)
          chart, versions = re.subn(r"^version:.*$", f"version: {version}", chart, count=1, flags=re.MULTILINE)
          if names != 1 or versions != 1 or re.search(r"^annotations:", chart, re.MULTILINE):
              raise SystemExit("unexpected upstream Chart.yaml structure")
          chart += f'''annotations:
            org.opencontainers.image.source: https://github.com/OpenHands/OpenHands
            org.opencontainers.image.revision: "{commit}"
            org.opencontainers.image.version: "{tag}"
          '''
          path.write_text(chart)
          PY

          helm lint "$build/openhands-agent-canvas"
          helm template openhands "$build/openhands-agent-canvas" --namespace ai >/dev/null
          find "$build/openhands-agent-canvas" -exec touch -h -d "@$epoch" {} +
          helm package "$build/openhands-agent-canvas" --destination "$build"
          package="$build/openhands-agent-canvas-$version.tgz"
          test -f "$package"
          test "$(helm show chart "$package" | awk '$1 == "version:" {print $2}')" = "$version"
          test "$(helm show chart "$package" | awk '$1 == "appVersion:" {print $2}')" = "$app_version"
          {
            echo "package=$package"
            echo "release_tag=openhands-chart-v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch upstream release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/upstream-release.json"
          notes="$RUNNER_TEMP/release-notes.md"
          title=""
          if gh api "repos/OpenHands/OpenHands/releases/tags/v$VERSION" > "$release_json"; then
            title=$(jq -r '.name // empty' "$release_json" | tr -d '\r' | head -n 1)
            jq -r '.body // empty' "$release_json" > "$notes"
          else
            echo "::warning::No upstream release found for v$VERSION; using fallback notes"
            : > "$notes"
          fi
          [ -n "$title" ] || title="v$VERSION"
          [ -s "$notes" ] || echo "Upstream release: https://github.com/OpenHands/OpenHands/releases/tag/v$VERSION" > "$notes"
          {
            echo "title=$title"
            echo "file=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish or recover chart and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.package.outputs.package }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          VERSION: ${{ steps.package.outputs.version }}
          TITLE: ${{ steps.notes.outputs.title }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: ./openhands/chart/release.sh
