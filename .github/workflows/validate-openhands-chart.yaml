---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate OpenHands chart

on:
  pull_request:
    paths:
      - .github/workflows/release-openhands-chart.yaml
      - .github/workflows/validate-openhands-chart.yaml
      - .github/scripts/release-openhands-chart.sh
      - .github/scripts/release-openhands-chart.Tests.sh
      - .gitmodules
      - renovate.json5
      - deploy/openhands/upstream

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4

      - name: Test release recovery contract
        run: bash .github/scripts/release-openhands-chart.Tests.sh

      - name: ShellCheck chart scripts
        run: shellcheck .github/scripts/release-openhands-chart.sh .github/scripts/release-openhands-chart.Tests.sh

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          upstream=deploy/openhands/upstream
          git -C "$upstream" fetch --force --tags origin
          chart="$upstream/helm/agent-canvas"
          tag=$(git -C "$upstream" describe --tags --exact-match)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          commit=$(git -C "$upstream" rev-parse HEAD)
          epoch=$(git -C "$upstream" show -s --format=%ct HEAD)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' "$chart/Chart.yaml")
          test "$tag" = "v$app_version"
          test -z "$(git -C "$upstream" status --porcelain)"

          build=$(mktemp -d)
          trap 'rm -rf "$build"' EXIT
          cp -a "$chart" "$build/openhands-agent-canvas"
          python3 - "$build/openhands-agent-canvas/Chart.yaml" "$version" "$tag" "$commit" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version, tag, commit = sys.argv[2:]
          chart = path.read_text()
          chart, names = re.subn(r"^name:.*$", "name: openhands-agent-canvas", chart, count=1, flags=re.MULTILINE)
          chart, versions = re.subn(r"^version:.*$", f"version: {version}", chart, count=1, flags=re.MULTILINE)
          if names != 1 or versions != 1 or re.search(r"^annotations:", chart, re.MULTILINE):
              raise SystemExit("unexpected upstream Chart.yaml structure")
          chart += f'''annotations:
            org.opencontainers.image.source: https://github.com/OpenHands/OpenHands
            org.opencontainers.image.revision: "{commit}"
            org.opencontainers.image.version: "{tag}"
          '''
          path.write_text(chart)
          PY

          helm lint "$build/openhands-agent-canvas"
          helm template openhands "$build/openhands-agent-canvas" --namespace ai >/dev/null
          find "$build/openhands-agent-canvas" -exec touch -h -d "@$epoch" {} +
          helm package "$build/openhands-agent-canvas" --destination "$build"
          package="$build/openhands-agent-canvas-$version.tgz"
          test -f "$package"
          test "$(helm show chart "$package" | awk '$1 == "version:" {print $2}')" = "$version"
          test "$(helm show chart "$package" | awk '$1 == "appVersion:" {print $2}')" = "$app_version"

          repro=$(mktemp -d)
          trap 'rm -rf "$build" "$repro"' EXIT
          find "$build/openhands-agent-canvas" -exec touch -h -d '@1' {} +
          find "$build/openhands-agent-canvas" -exec touch -h -d "@$epoch" {} +
          helm package "$build/openhands-agent-canvas" --destination "$repro"
          repro_package="$repro/openhands-agent-canvas-$version.tgz"
          cmp -s "$package" "$repro_package"
          test "$(sha256sum "$package" | awk '{print $1}')" = "$(sha256sum "$repro_package" | awk '{print $1}')"
